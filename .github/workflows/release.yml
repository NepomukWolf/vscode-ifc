name: Release VSCode Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install vsce
        run: npm install -g @vscode/vsce
      
      - name: Compile TypeScript
        run: npm run compile

      - name: Verify tag is on production
        run: |
          git fetch origin production:refs/remotes/origin/production
          git merge-base --is-ancestor "$GITHUB_SHA" origin/production

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)." >&2
            exit 1
          fi

      - name: Package extension
        run: vsce package --out extension.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Release for commit ${{ github.sha }}

            **Tag:** `${{ github.ref_name }}`
            **Branch:** `production`
            **Triggered by:** ${{ github.actor }}
          files: extension.vsix
